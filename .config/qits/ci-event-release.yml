# The release pipeline: this repository reacts to its OWN release and publishes the version-tagged
# image. That is not a loop — `SCMRelease` says only "source control has this version", and
# qits-projects' Auto Release publishes it (SCMRelease, not SCMPublishTag: the git host's tag
# primitive fires no post-receive and announces nothing). qits-ci turns this green run into one
# `SoftwareRelease` per entry
# under `artifacts:`, and nothing here listens for that.
#
# The repository has no version file. A qits release creates the version and the annotated tag, then
# supplies the same version in the event.
event: SCMRelease
when:
  # The new repository name. `repository` on SCMRelease is the PUBLIC name — measured live on
  # 2026-08-29, when a sibling's train followed this same field — so a rename moves this line and
  # the pipeline stops firing the moment it does not.
  - repository: { exact: qits-database-oci }

# A DECLARATION, NOT A REPORT. qits-ci cannot see what the step pushed; it announces on the strength
# of this line. Keep it true.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME ANY MORE, and it must not become one. Every
# environment's database container, volume and DNS alias is spelled `qits-oci-postgresql`, and the
# bootstrap writes that name into every consumer's JDBC url. So the published coordinate stays put
# while the repository is renamed — and `deployments.yml` must pin `application: qits-oci-postgresql`
# in the same campaign, because the deployer derives the image it runs from the application name and
# would otherwise start looking for a `qits-database-oci` image nothing publishes. That key is
# beside this file now.
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-oci-postgresql }

steps:
    # ci-base: buildctl for the build, git for the tag checkout, jq for the event payload, curl for
    # the SBOM PUT. `build: true` is the platform builder's declaration — qits-ci hands such a step
    # $QITS_BUILD_REGISTRY and qits-containers hands it $BUILDKIT_HOST, and the host docker socket
    # this step used to be given is not mounted at all any more. ci-event-release-request.yml
    # carries the argument at length; qits-buildkit-plan.md in the wrapper is the whole migration.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed — and a green release run is what makes qits-ci announce the artifact, so it has
      # to mean the image really was built and pushed. -u makes an unset injected variable stop the
      # step too.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch. Either way this recipe must fail
      # here, naming the cause, rather than push a ref composed out of empty strings.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # The payload reaches the container verbatim as one string in $QITS_EVENT_PAYLOAD — there is
      # no per-field projection. ci-base carries jq; the case guard refuses a malformed or absent
      # value before any registry tag is created, since a CalVer is only digits and dots.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -r '.version')
      case "$version" in
        ''|null|*[!0-9.]*) echo "SCMRelease carries no valid CalVer" >&2; exit 1 ;;
      esac

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # a later push moves; the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec, and the URL rather than `origin` because every address arrives as
      # environment. `checkout --detach` peels the annotated tag to its commit.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # THE BUILD IS ci-event-release-request.yml's, AND THE TWO STAY MATCHED — byte for byte in
      # every buildctl argument, because the platform builder's cache is shared and a matched build
      # is what makes a release that follows a green fold a stack of cache hits rather than a second
      # build of the same layers.
      #
      # `push=true` IS THE PUBLISH: the image goes from the builder to the registry and never enters
      # any local image store, which is also why there is no `docker rmi` question left — the old
      # note about a concurrent-build rmi race described a store this pipeline no longer touches.
      # $QITS_BUILD_REGISTRY is the registry as the BUILDER resolves it; $QITS_REGISTRY stays the
      # host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-oci-postgresql:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -------------------------------------------------------------------------------
      # THE SBOM FOR AN IMAGE LIKE THIS ONE IS ITS `FROM` LINE, and there is nothing else it
      # honestly could be: this Dockerfile only layers this platform's configuration onto an
      # upstream postgres, and declares no manifest a scanner could read. What a consumer of it
      # needs to know is which upstream it inherits and at which tag, and that is exactly one
      # `FROM` per stage. The same shape qits-build-images-oci publishes for the five step
      # images, with its loop collapsed — there is one image here.
      #
      # AFTER THE PUSH AND BEFORE GREEN, which is the ordering rule rather than a preference:
      # qits-ci announces `SoftwareRelease` only for a green run, so a document stored here can
      # never be missing for a version somebody was told about. A failed PUT fails the release on
      # purpose.
      #
      # A multi-stage file names its OWN earlier stages in later `FROM`s, and a stage alias is not
      # an upstream image. This file has one stage today and the skip below therefore removes
      # nothing; it is here so the document stays right the day it grows a builder stage.
      stages=$(sed -n \
        's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]].*[[:space:]][Aa][Ss][[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*$/\1/p' \
        Dockerfile)
      # Every `FROM`'s image ref: drop the keyword, drop any `--platform=`-style flag, keep the
      # first word — which leaves the ref alone and discards a trailing `AS <stage>`.
      bases=$(sed -n 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]\{1,\}//p' Dockerfile \
        | sed 's/--[^[:space:]]*[[:space:]]\{1,\}//g' \
        | sed 's/[[:space:]].*$//')

      components=''
      depends=''
      seen=''
      sep=''
      for base in $bases; do
        for stage in $stages; do
          if [ "$base" = "$stage" ]; then base=''; break; fi
        done
        [ -n "$base" ] || continue
        # The ref reaches a JSON document and a purl, so its shape is checked the same way the
        # version was: a reference is the registry's own charset and nothing else. Nothing but this
        # Dockerfile feeds this, and that is precisely why the guard is cheap to keep.
        case "$base" in
          ''|*[!a-zA-Z0-9._:/@-]*)
            echo "Dockerfile: unusable FROM '$base'" >&2; exit 1 ;;
        esac
        # DISTINCT BASES ONLY — two stages built from one upstream are one dependency.
        case " $seen " in
          *" $base "*) continue ;;
        esac
        seen="$seen $base"

        case "$base" in
          # A digest ref pins harder than a tag, so the digest IS the version.
          *@*)
            name=${base%@*}
            tag=${base##*@}
            ;;
          *)
            # An untagged `FROM` means `latest` by definition. The colon is not proof of a tag: a
            # registry host may carry a port, and in `host:5000/image` the colon is the port's.
            tag=${base##*:}
            case "$base" in
              *:*) : ;;
              *) tag='' ;;
            esac
            case "$tag" in
              */*) tag='' ;;
            esac
            if [ -n "$tag" ]; then
              name=${base%:*}
            else
              name=$base
              tag=latest
            fi
            ;;
        esac

        purl="pkg:docker/$name@$tag"
        components="$components$sep$(printf \
          '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"}' \
          "$purl" "$name" "$tag" "$purl")"
        depends="$depends$sep$(printf '"%s"' "$purl")"
        sep=','
      done
      if [ -z "$components" ]; then
        echo "Dockerfile declares no base image" >&2; exit 1
      fi

      # CycloneDX 1.6: the image this run pushed as the metadata component, one container component
      # per distinct base, and a single dependency edge from the root to all of them. Three appends
      # rather than one unreadable format string; every value goes through `%s`, so nothing in a ref
      # can be read as a printf directive.
      #
      # THE ROOT IS THE DECLARED NAME, unqualified — `artifacts:` above says
      # `{type: docker, name: qits/qits-oci-postgresql}`, and that is the coordinate a
      # SoftwareRelease consumer asks for. The components keep the refs the build actually
      # resolved, registry host and all, because that is what this image is really made of.
      root="pkg:docker/qits/qits-oci-postgresql@$version"
      printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,' > sbom.json
      printf '"metadata":{"component":{"type":"container","bom-ref":"%s",' "$root" >> sbom.json
      printf '"name":"qits/qits-oci-postgresql","version":"%s","purl":"%s"}},' \
        "$version" "$root" >> sbom.json
      printf '"components":[%s],"dependencies":[{"ref":"%s","dependsOn":[%s]}]}\n' \
        "$components" "$root" "$depends" >> sbom.json

      # The store is a sibling path of the npm registry inside the qits-artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries, and the
      # one this container can actually dial. NOT $QITS_REGISTRY, which is the host-published name
      # and answers curl from in here with an instant connection refusal, and not
      # $QITS_BUILD_REGISTRY either — that one is the BUILDER's address for the registry and this
      # PUT is made by the step, not by the build. The edge in front of the host name 401s every
      # sessionless write besides (measured twice on 2026.902.53027). ci-base
      # carries the curl, so no helper container is needed for the PUT.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom.json \
        "$sbom_base/docker/qits/qits-oci-postgresql/-/$version"
