# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, INCLUDING THE ONE THAT PUSHES AN IMAGE. It stays in the gating half on
# purpose: whatever a run publishes is published before anything later can fail. The coordinate it
# pushes is the MERGED SHA, which no `ReleaseRequestChanged` is ever derived from, so this pipeline
# cannot re-trigger itself; and a redelivered event re-pushes identical content under the same tag,
# which is why nothing here treats an existing tag as an error. The verdict returns on the ordinary
# `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what qits-projects'
# `BuildStatusListener` matches on together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# THE TAG IS THE CONTRACT. qits-platform-deployments derives the image it runs from the application
# name and the sha of the green build, so the name segment has to be exactly `qits-oci-postgresql`.
# A different segment builds fine and deploys nothing. The repository is renamed qits-database-oci
# and this segment does NOT follow it: `deployments.yml` pins `application: qits-oci-postgresql`
# instead, which is also how every environment spells the database's container, volume and DNS
# alias.
#
# No `--network` flag: nothing in this build dials the platform. The base image is pulled through
# the OCI mirror by the daemon, not by the build.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-database-oci }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-oci-postgresql:$QITS_CI_SHA"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
