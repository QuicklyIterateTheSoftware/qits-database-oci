version: 1
actions:
  - id: svc-list
    name: list swarm services and qits-ci env
    execute: |
      docker service ls --format '{{.Name}}'
  - id: svc-fix
    name: point qits-ci central build url at the loopback mirror
    execute: |
      set -ex
      docker service update --env-add QITS_MIRROR_MAVEN_CENTRAL_BUILD_URL=http://127.0.0.1:8082/artifacts/maven/central dev-qits-ci
  - id: mirror-state
    name: inspect the mirror service and its published port
    execute: |
      set -x
      docker service ps qits-platform-mirror --no-trunc --format '{{.Name}} {{.CurrentState}} {{.Error}}' | head
      docker service inspect qits-platform-mirror --format '{{json .Endpoint.Ports}}'
      docker service inspect qits-platform-mirror --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
      curl -s -m 5 -o /dev/null -w "loopback 8082 central pom: %{http_code}\n" http://127.0.0.1:8082/artifacts/maven/central/io/quarkus/platform/quarkus-bom/3.34.6/quarkus-bom-3.34.6.pom || echo "loopback refused"
