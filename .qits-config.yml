version: 1
actions:
  - id: disable2
    name: set enabled=false only
    execute: |
      set -ex
      docker service update --env-add QITS_MIRROR_MAVEN_CENTRAL_ENABLED=false dev-qits-ci
  - id: showenv
    name: show qits-ci mirror env
    execute: |
      docker service inspect dev-qits-ci --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | grep -i MIRROR_MAVEN || echo NONE
