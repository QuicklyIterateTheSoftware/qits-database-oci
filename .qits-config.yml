version: 1
actions:
  - id: diag
    name: mirror deploy diagnosis
    execute: |
      set +e
      echo "=== full task history ==="
      docker service ps qits-platform-mirror --no-trunc --format '{{.CurrentState}} | {{.Image}} | {{.Error}}' 2>/dev/null | head -8
      echo "=== does my image (3cfd9711) exist in the registry? ==="
      docker manifest inspect registry.dev.localhost:8080/qits/qits-platform-mirror:3cfd9711f906b1bc141e7884a3dc980a4d91744b >/dev/null 2>&1 && echo "MY IMAGE EXISTS" || echo "MY IMAGE MISSING (build never pushed it)"
      echo "=== newest mirror tags in registry ==="
      docker exec $(docker ps --filter name=qits-platform-mirror -q | head -1) sh -c 'echo n/a' 2>/dev/null
